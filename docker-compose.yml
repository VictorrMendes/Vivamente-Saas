services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vivamente
      POSTGRES_USER: vivamente
      POSTGRES_PASSWORD: vivamente
    volumes:
      - oauth_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vivamente -d vivamente"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://vivamente:vivamente@db:5432/vivamente
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./.secrets:/app/.secrets:ro
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  oauth_postgres_data:
