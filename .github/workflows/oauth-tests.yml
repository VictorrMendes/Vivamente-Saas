name: Oauth Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/Oauth

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vivamente
          POSTGRES_PASSWORD: vivamente
          POSTGRES_DB: vivamente
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vivamente:vivamente@localhost:5432/vivamente
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      ALLOWED_ORIGINS: http://localhost:3000
      # Placeholders - todo teste que chama Firebase/Resend mocka a chamada
      # (ver apps/auth/tests/test_services.py); estas variaveis so precisam
      # existir pra config/settings/base.py carregar.
      FIREBASE_WEB_API_KEY: ci-placeholder
      RESEND_API_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/Oauth/requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Rodar testes
        run: python manage.py test apps tests
